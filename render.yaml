services:
  - type: web
    name: isl-recognition-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: standard
    region: oregon
    branch: main
    envVars:
      - key: PORT
        value: 5001
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/status
